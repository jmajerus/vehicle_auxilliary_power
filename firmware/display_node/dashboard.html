<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Telemetry</title>
  <!--
    MQTT.js via CDN. For offline / in-car use, download the file and replace
    this tag with: <script src="mqtt.min.js"></script>
    Download: https://unpkg.com/mqtt/dist/mqtt.min.js
  -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root {
      --bg:      #0f172a;
      --card:    #1e293b;
      --border:  #334155;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --green:   #22c55e;
      --yellow:  #eab308;
      --red:     #ef4444;
      --blue:    #3b82f6;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      padding: 0.75rem 1.1rem;
    }

    h1 { font-size: 1rem; font-weight: 700; letter-spacing: 0.12em; }

    #status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    #dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
    }
    #dot.on  { background: var(--green); }
    #dot.mid { background: var(--yellow); }

    /* ── Error banner ───────────────────────────────────────────────────── */
    #error-banner {
      display: none;
      align-items: center;
      gap: 0.6rem;
      background: #450a0a;
      border: 1px solid #ef4444;
      border-radius: 0.6rem;
      padding: 0.65rem 1rem;
      font-size: 0.82rem;
      color: #fca5a5;
    }
    #error-banner.visible { display: flex; }
    #error-banner strong   { color: #ef4444; }
    #error-close {
      margin-left: auto;
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 0.2rem;
      line-height: 1;
    }

    /* ── Settings bar ────────────────────────────────────────────────────── */
    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      padding: 0.7rem 1rem;
    }

    .settings label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .settings input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      color: var(--text);
      padding: 0.3rem 0.6rem;
      font-size: 0.82rem;
      width: 200px;
    }
    .settings input:focus { outline: none; border-color: var(--blue); }

    button {
      border: none;
      border-radius: 0.35rem;
      padding: 0.36rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }
    #btn-connect    { background: var(--blue); }
    #btn-disconnect { background: #475569; }
    button:hover    { opacity: 0.85; }

    /* ── Gauge grid ──────────────────────────────────────────────────────── */
    .gauges {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
    }

  </style>
</head>
<body>

<header>
  <h1>VEHICLE TELEMETRY</h1>
  <div id="status">
    <div id="dot"></div>
    <span id="status-text">Disconnected</span>
  </div>
</header>

<div id="error-banner">
  <strong>&#9888;</strong>
  <span id="error-text"></span>
  <button id="error-close" onclick="dismissError()" title="Dismiss">&#x2715;</button>
</div>

<div class="settings">
  <label>Broker WS
    <input id="url"    type="text" value="ws://127.0.0.1:9001"
           title="Local dev: ws://127.0.0.1:9001 — In-car GL.iNet: ws://192.168.8.1:9001" />
  </label>
  <label>Prefix
    <input id="prefix" type="text" value="vehicle" style="width:90px"
           title="MQTT topic prefix matching your hub firmware" />
  </label>
  <button id="btn-connect"    onclick="mqttConnect()">Connect</button>
  <button id="btn-disconnect" onclick="mqttDisconnect()">Disconnect</button>
</div>

<div class="gauges">

  <!-- telemetry-gauge custom elements — each is fully self-contained.
       Rendering, theming and stale-dimming live inside Shadow DOM.
       el.update(value) is called by the MQTT message handler below. -->

  <telemetry-gauge id="rpm"
    label="Engine RPM" unit="rpm"
    min="0" max="7000"
    warn="4500" crit="5500"
    decimals="0"
    base-color="#22c55e"></telemetry-gauge>

  <telemetry-gauge id="speed"
    label="Speed" unit="km/h"
    min="0" max="200"
    decimals="0"
    base-color="#3b82f6" warn-color="#3b82f6" crit-color="#3b82f6"></telemetry-gauge>

  <telemetry-gauge id="temp"
    label="Coolant Temp" unit="°C"
    min="40" max="130"
    warn="100" crit="115"
    decimals="0"
    base-color="#22c55e"></telemetry-gauge>

  <telemetry-gauge id="volt"
    label="Aux Voltage" unit="V"
    min="10" max="16"
    warn="14.8" crit="15.5"
    warn-low="11.5" crit-low="10.8"
    decimals="2"
    base-color="#22c55e"></telemetry-gauge>

  <!-- zero-mark draws a tick at the arc midpoint to mark 0 A -->
  <telemetry-gauge id="amp"
    label="Aux Current" unit="A"
    min="-50" max="50"
    warn="40" crit="48"
    warn-low="-40" crit-low="-48"
    decimals="1"
    base-color="#22c55e"
    zero-mark></telemetry-gauge>

</div>

<script>
// ── TelemetryGauge — native Custom Element ───────────────────────────────────
// Self-contained SVG arc gauge with Shadow DOM. All rendering and theming
// live inside the element; the page only calls el.update(value).
//
// HTML attributes (set once, static):
//   label, unit, min, max, decimals
//   base-color, warn-color, crit-color
//   warn, crit        — high thresholds
//   warn-low, crit-low — low thresholds (e.g. low voltage / high discharge)
//   zero-mark         — boolean; draws a centre tick on the arc (for ±A gauges)
//
// Public API:
//   el.update(value)   — push a new reading
//   el.stale = bool    — dim/undim (set by the MQTT stale-data timer)
{
  const _R    = 60;
  const _CIRC = 2 * Math.PI * _R;     // 376.99
  const _ARC  = _CIRC * (240 / 360);  // 251.33 — 240° visible arc

  class TelemetryGauge extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;  // already built on browser upgrade
      this.attachShadow({ mode: 'open' });
      this._build();
    }

    // ── Public API ───────────────────────────────────────────────────────
    update(raw) {
      if (!this._arc) return;
      const a = n => this.getAttribute(n);
      const min     = +a('min') || 0,  max = +a('max') || 100;
      const warn    = this.hasAttribute('warn')     ? +a('warn')     :  Infinity;
      const crit    = this.hasAttribute('crit')     ? +a('crit')     :  Infinity;
      const warnLow = this.hasAttribute('warn-low') ? +a('warn-low') : -Infinity;
      const critLow = this.hasAttribute('crit-low') ? +a('crit-low') : -Infinity;
      const warnC   = a('warn-color') || '#eab308';
      const critC   = a('crit-color') || '#ef4444';
      const dec     = +(a('decimals') ?? 0);

      const frac   = Math.max(0, Math.min(1, (raw - min) / (max - min)));
      const filled = (_ARC * frac).toFixed(2);
      this._arc.setAttribute('stroke-dasharray', `${filled} ${(_CIRC - filled).toFixed(2)}`);

      const color = (raw >= crit  || raw <= critLow) ? critC
                  : (raw >= warn  || raw <= warnLow) ? warnC
                  : this._base;
      this._arc.setAttribute('stroke', color);
      this._val.setAttribute('fill',   color);
      this._val.textContent = raw.toFixed(dec);
    }

    set stale(flag) {
      flag ? this.setAttribute('stale', '') : this.removeAttribute('stale');
    }

    // ── Private ──────────────────────────────────────────────────────────
    _build() {
      const label = this.getAttribute('label')      ?? '';
      const unit  = this.getAttribute('unit')       ?? '';
      this._base  = this.getAttribute('base-color') ?? '#22c55e';
      const zm    = this.hasAttribute('zero-mark');

      this.shadowRoot.innerHTML = `
        <style>
          :host              { display: contents; }
          :host([stale]) .card { opacity: 0.35; }
          .card {
            background:     var(--card,   #1e293b);
            border:         1px solid var(--border, #334155);
            border-radius:  0.75rem;
            padding:        0.9rem 0.5rem 0.6rem;
            display:        flex;
            flex-direction: column;
            align-items:    center;
            gap:            0.1rem;
            transition:     opacity 0.6s;
          }
          .lbl {
            font-family:    -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size:      0.68rem;
            font-weight:    600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color:          var(--muted, #64748b);
          }
          svg  { width: 150px; height: 130px; overflow: visible; }
          .trk { stroke: #1e3a5f; }
          .arc { transition: stroke-dasharray 0.12s linear, stroke 0.3s ease; }
          .num {
            font-family: 'Courier New', monospace;
            font-size:   20px;
            font-weight: 700;
            fill:        var(--text, #e2e8f0);
            transition:  fill 0.3s;
          }
          .unt { font-size: 10px; fill: var(--muted, #64748b); }
        </style>
        <div class="card">
          <div class="lbl">${label}</div>
          <svg viewBox="0 0 150 130">
            <circle class="trk" cx="75" cy="78" r="60" fill="none" stroke-width="10"
              stroke-dasharray="251.33 125.66" stroke-linecap="round"
              transform="rotate(150 75 78)"/>
            <circle class="arc" cx="75" cy="78" r="60" fill="none"
              stroke="${this._base}" stroke-width="10"
              stroke-dasharray="0 376.99" stroke-linecap="round"
              transform="rotate(150 75 78)"/>
            <text class="num" x="75" y="83" text-anchor="middle">—</text>
            <text class="unt" x="75" y="101" text-anchor="middle">${unit}</text>
            ${zm ? '<line x1="75" y1="20" x2="75" y2="28" stroke="#64748b" stroke-width="2"/>' : ''}
          </svg>
        </div>`;

      this._arc = this.shadowRoot.querySelector('.arc');
      this._val = this.shadowRoot.querySelector('.num');
    }
  }

  customElements.define('telemetry-gauge', TelemetryGauge);
}

// ── Gauge helpers ─────────────────────────────────────────────────────────────
function updateGauge(id, raw) {
  document.getElementById(id)?.update(raw);
}

function setStale(stale) {
  document.querySelectorAll('telemetry-gauge').forEach(el => el.stale = stale);
}

// ── MQTT ──────────────────────────────────────────────────────────────────────
let client       = null;
let staleTimer   = null;   // dims gauges if no messages arrive within this window
const STALE_MS   = 5000;   // 5 s without data → gauges go dim

function mqttConnect() {
  dismissError();
  if (client) client.end(true);

  const url    = document.getElementById('url').value.trim();
  const prefix = document.getElementById('prefix').value.trim().replace(/\/$/, '');

  if (!url.startsWith('ws://') && !url.startsWith('wss://')) {
    showError('Broker URL must start with ws:// or wss://');
    return;
  }

  setStatus('Connecting…', 'mid');

  client = mqtt.connect(url, {
    clientId:        'dashboard_' + Math.random().toString(16).slice(2, 8),
    keepalive:       30,
    connectTimeout:  6000,
    reconnectPeriod: 0,     // no auto-reconnect — we show an error instead
  });

  client.on('connect', () => {
    dismissError();
    setStatus('Connected — ' + url, 'on');
    client.subscribe(`${prefix}/engine/#`);
    client.subscribe(`${prefix}/battery/#`);
    resetStaleTimer();
  });

  client.on('message', (topic, payload) => {
    const val = parseFloat(payload.toString());
    if (isNaN(val)) return;
    resetStaleTimer();
    const key = topic.split('/').pop();   // last path segment
    switch (key) {
      case 'rpm':              updateGauge('rpm',   val);         break;
      case 'speed_kph':        updateGauge('speed', val);         break;
      case 'coolant_temp':     updateGauge('temp',  val);         break;
      case 'aux_voltage_mv':   updateGauge('volt',  val / 1000);  break;
      case 'aux_current_ma':   updateGauge('amp',   val / 1000);  break;
    }
  });

  // MQTT.js wraps WebSocket close codes in the error message string.
  // We parse it out to give the user actionable feedback.
  client.on('error', e => {
    const msg = e.message || String(e);
    // Connection refused / host unreachable typically surfaces as code 1006
    if (msg.includes('1006') || msg.toLowerCase().includes('refused')) {
      showError(
        `Cannot reach broker at ${url}. ` +
        'Check that Mosquitto is running and the WebSocket listener (port 9001) is enabled.'
      );
    } else {
      showError('MQTT error: ' + msg);
    }
    setStatus('Error', '');
    setStale(true);
  });

  client.on('close', () => {
    // Only show disconnect message if we were previously connected
    // (avoids overwriting a more specific error message on initial failure).
    if (document.getElementById('dot').className === 'on') {
      setStatus('Disconnected', '');
      showError('Connection to broker closed. Is the broker still running?');
    }
    setStale(true);
  });
}

function mqttDisconnect() {
  clearTimeout(staleTimer);
  if (client) { client.end(true); client = null; }
  setStatus('Disconnected', '');
  setStale(true);
}

function setStatus(msg, dotClass) {
  document.getElementById('status-text').textContent = msg;
  document.getElementById('dot').className = dotClass;
}

function showError(msg) {
  document.getElementById('error-text').textContent = msg;
  document.getElementById('error-banner').classList.add('visible');
}

function dismissError() {
  document.getElementById('error-banner').classList.remove('visible');
}



function resetStaleTimer() {
  setStale(false);
  clearTimeout(staleTimer);
  staleTimer = setTimeout(() => {
    setStale(true);
    setStatus('No data — simulator stopped?', 'mid');
  }, STALE_MS);
}
</script>
</body>
</html>
