# Mosquitto MQTT broker configuration for GL.iNet router (OpenWrt)
#
# Deploy to: /etc/mosquitto/mosquitto.conf
# Applied by: /etc/init.d/mosquitto restart
#
# This broker is the central hub for all in-car telemetry.
# The Waveshare CAN hub publishes to it; display nodes subscribe from it.
# No internet connection is required — the GL.iNet acts as a self-contained
# in-car Wi-Fi access point and message router.

# ── Network ──────────────────────────────────────────────────────────────────

# Listen on all interfaces (LAN + Wi-Fi AP) on the standard MQTT port.
listener 1883

# Bind only to the LAN/Wi-Fi bridge interface if you want to restrict to
# in-car devices only (recommended once everything is working):
#   listener 1883 br-lan

# ── Authentication ────────────────────────────────────────────────────────────

# Allow unauthenticated connections from trusted in-car devices.
# This is acceptable for a closed, private vehicle network with no
# internet-facing exposure. If the GL.iNet is ever bridged to a public
# network, add a password file here instead.
allow_anonymous true

# To add password authentication later:
#   allow_anonymous false
#   password_file /etc/mosquitto/passwd
#   (create with: mosquitto_passwd -c /etc/mosquitto/passwd <username>)

# ── Persistence ──────────────────────────────────────────────────────────────

# Disable persistence — telemetry data is real-time only; no need to
# replay old sensor values after a broker restart.
persistence false

# ── Logging ──────────────────────────────────────────────────────────────────

# Log to syslog (viewable with: logread | grep mosquitto)
log_dest syslog
log_type error
log_type warning
log_type notice

# Uncomment to enable verbose connection/subscription logging for debugging:
# log_type information
# log_type subscribe

# ── Performance ──────────────────────────────────────────────────────────────

# Maximum number of QoS 1/2 messages in flight per client.
# At QoS 0 (fire-and-forget, used by the hub) this has no effect, but
# set it low to protect the router's limited RAM if clients use QoS 1.
max_inflight_messages 10

# Maximum queued messages per client when a subscriber is slow.
max_queued_messages 50
